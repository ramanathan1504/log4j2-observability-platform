spring.application.name=metrics
server.port=8085

# Logging
logging.level.root=INFO
logging.level.com.observability=DEBUG
logging.pattern.console=%d{ISO8601} [%thread] %-5p %c{1} - %msg%n [traceId=%X{traceId}]
logging.file.name=logs/metrics.log

# Metrics Configuration
metrics.buffer.size=3600
metrics.window.duration.seconds=60
metrics.aggregation.interval.seconds=10
metrics.prometheus.scrape.interval=15

# Percentile Calculations
metrics.percentiles=50,90,99
metrics.linux.proc.enabled=true

