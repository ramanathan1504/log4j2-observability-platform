server:
  port: 8088

spring:
  kafka:
    # Use the host-mapped Kafka port from docker-compose (9094)
    # If you changed docker-compose to expose 9092, update this accordingly.
    bootstrap-servers: localhost:9094

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    template:
      default-topic: log-events